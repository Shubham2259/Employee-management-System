<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card col-md-6 mx-auto">
        <div class="card-header">
            <h4 th:text="${employee.id == null ? 'Add Employee' : 'Update Employee'}"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/employees}" th:object="${employee}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input class="form-control" th:field="*{name}">
                    <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" th:field="*{email}">
                    <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input class="form-control" th:field="*{department}">
                    <small class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Salary</label>
                    <input type="number" class="form-control" th:field="*{salary}">
                    <small class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></small>
                </div>

                <button class="btn btn-primary">Save</button>
                <a class="btn btn-secondary" th:href="@{/employees}">Back</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
