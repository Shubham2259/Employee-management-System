<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employees</title>
<!--    <link rel="stylesheet" th:href="@{/style.css}">-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-info bg-opacity-14">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 style="color: white;">Employee Management</h3>
        <a class="btn btn-success" th:href="@{/employees/new}">+ Add Employee</a>
    </div>

    <form class="row g-2 mb-3" th:action="@{/employees}" method="get">
        <div class="col-md-10">
            <input class="form-control" name="q" placeholder="Search by name..." th:value="${q}">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100">Search</button>
        </div>
    </form>
    <div class="mb-3" th:if="${q != null}">
        <a th:href="@{/employees}" class="btn btn-secondary">
            ⬅ Back to All Employees
        </a>
    </div>


    <div class="card">
        <div class="card-body">
            <table class="table table-bordered table-hover">
                <thead>
                <tr>
                    <th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Salary(per Annum)</th><th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${employees}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.name}"></td>
                    <td th:text="${e.email}"></td>
                    <td th:text="${e.department}"></td>
                    <td th:text="${e.salary}"></td>
                    <td>
                        <a class="btn btn-warning btn-sm" th:href="@{/employees/edit/{id}(id=${e.id})}">Edit</a>
                        <a class="btn btn-danger btn-sm"
                           th:href="@{/employees/delete/{id}(id=${e.id})}"
                           onclick="return confirm('Delete this employee?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
